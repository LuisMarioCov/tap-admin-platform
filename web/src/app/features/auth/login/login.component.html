<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">TAP Terminal</p>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingresa con tu cuenta para acceder al panel administrativo.</p>

    @if (errorMessage()) {
      <div class="alert" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Correo electrónico
        <input type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.hasError('required')) {
          <span class="field-error">El correo es obligatorio.</span>
        }
        @if (form.controls.email.touched && form.controls.email.hasError('email')) {
          <span class="field-error">Ingresa un correo válido.</span>
        }
      </label>

      <label>
        Contraseña
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.hasError('required')) {
          <span class="field-error">La contraseña es obligatoria.</span>
        }
      </label>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="hint">
      Demo admin: <code>admin&#64;tap.local</code> / <code>Admin123!</code>
    </p>
  </div>
</section>

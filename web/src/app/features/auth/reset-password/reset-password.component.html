<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="fs-2 fw-bold">TAP Admin</span>
      <div class="text-secondary">Nueva contraseña</div>
    </div>

    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-3">Restablecer contraseña</h2>
        <p class="text-secondary text-center mb-4">Usa el token del correo. Caduca en 1 hora.</p>

        @if (errorMessage()) {
          <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
        }
        @if (successMessage()) {
          <div class="alert alert-success" role="status">{{ successMessage() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" formControlName="email" />
          </div>
          <div class="mb-3">
            <label class="form-label">Token</label>
            <input type="text" class="form-control" formControlName="token" />
          </div>
          <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" class="form-control" formControlName="password" autocomplete="new-password" />
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input
              type="password"
              class="form-control"
              formControlName="password_confirmation"
              autocomplete="new-password"
            />
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
              {{ loading() ? 'Guardando…' : 'Actualizar contraseña' }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center text-secondary mt-3">
      <a routerLink="/login">Volver al login</a>
    </div>
  </div>
</div>

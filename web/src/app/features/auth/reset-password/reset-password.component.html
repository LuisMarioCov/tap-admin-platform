<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">TAP Terminal</p>
    <h1>Nueva contraseña</h1>
    <p class="subtitle">Usa el enlace del correo. El token caduca en 1 hora.</p>

    @if (errorMessage()) {
      <div class="alert error" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert success" role="status">{{ successMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Correo
        <input type="email" formControlName="email" />
      </label>
      <label>
        Token
        <input type="text" formControlName="token" />
      </label>
      <label>
        Nueva contraseña
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <label>
        Confirmar contraseña
        <input type="password" formControlName="password_confirmation" autocomplete="new-password" />
      </label>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando…' : 'Actualizar contraseña' }}
      </button>
    </form>

    <p class="hint"><a routerLink="/login">Volver al login</a></p>
  </div>
</section>

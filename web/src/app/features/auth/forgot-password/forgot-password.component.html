<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="fs-2 fw-bold">TAP Admin</span>
      <div class="text-secondary">Recuperación de acceso</div>
    </div>

    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-3">Recuperar contraseña</h2>
        <p class="text-secondary text-center mb-4">
          Enviaremos un enlace seguro (válido 1 hora). Nunca enviamos la contraseña en claro.
        </p>

        @if (errorMessage()) {
          <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
        }
        @if (successMessage()) {
          <div class="alert alert-success" role="status">{{ successMessage() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="forgot-email">Correo electrónico</label>
            <input
              id="forgot-email"
              type="email"
              class="form-control"
              formControlName="email"
              autocomplete="username"
            />
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
              {{ loading() ? 'Enviando…' : 'Enviar enlace' }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center text-secondary mt-3">
      <a routerLink="/login">Volver al login</a>
    </div>
  </div>
</div>

<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">TAP Terminal</p>
    <h1>Recuperar contraseña</h1>
    <p class="subtitle">Te enviaremos un enlace seguro (1 hora). Nunca mandamos la contraseña en claro.</p>

    @if (errorMessage()) {
      <div class="alert error" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert success" role="status">{{ successMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Correo electrónico
        <input type="email" formControlName="email" autocomplete="username" />
      </label>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Enviando…' : 'Enviar enlace' }}
      </button>
    </form>

    <p class="hint"><a routerLink="/login">Volver al login</a></p>
  </div>
</section>
